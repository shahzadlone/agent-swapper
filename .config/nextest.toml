[profile.default]
slow-timeout = { period = "30s", terminate-after = 2 }
retries = 0

[profile.ci]
fail-fast = false
status-level = "pass"
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"
store-failure-output = true

[test-groups.handover-crypto]
max-threads = 1

[[profile.default.overrides]]
filter = 'test(/handover/)'
test-group = "handover-crypto"
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
filter = "test(/thousand_event/)"
slow-timeout = { period = "60s", terminate-after = 3 }
