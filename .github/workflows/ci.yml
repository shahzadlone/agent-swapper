name: Rust quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +1.98.0 fmt --all --check
      - name: Record platform evidence
        run: python tools/platform_evidence.py
      - name: Clippy
        run: cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
      - name: Windows per-run supervision probe
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: cargo +1.98.0 run --locked -p agentswapper-core --example windows_supervision_probe
      - name: Linux admission transport probe
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: cargo +1.98.0 run --locked -p agentswapper-core --example linux_admission_transport_probe
      - name: Linux guardian lease and process-group probe
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: cargo +1.98.0 run --locked -p agentswapper-core --example linux_guardian_probe
      - name: Linux guardian terminal job control
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: |
          cargo +1.98.0 build --locked -p agentswapper-core --example linux_terminal_guardian_probe
          python tools/check_linux_terminal_guardian.py target/debug/examples/linux_terminal_guardian_probe
      - name: Restore pinned test runner
        id: nextest-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/bin/cargo-nextest*
          key: nextest-${{ runner.os }}-${{ runner.arch }}-rust1.98.0-v0.9.150
      - name: Install test runner
        if: steps.nextest-cache.outputs.cache-hit != 'true'
        run: cargo +1.98.0 install cargo-nextest --version 0.9.150 --locked
      - name: Save pinned test runner
        if: steps.nextest-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/bin/cargo-nextest*
          key: nextest-${{ runner.os }}-${{ runner.arch }}-rust1.98.0-v0.9.150
      - name: Tests
        run: cargo +1.98.0 nextest run --locked --workspace --profile ci
      - name: Dashboard terminal entry and restoration
        if: runner.os != 'Windows'
        timeout-minutes: 2
        run: |
          cargo +1.98.0 build --locked -p agentswapper-cli --bins
          python tools/check_dashboard_pty.py target/debug/aswp target/debug/agentswapper
      - name: Preferences concurrency stress
        timeout-minutes: 3
        run: cargo +1.98.0 nextest run --locked -p agentswapper-core --profile ci -E 'test(config_concurrent_setters)' --stress-count 25 --fail-fast
      - name: Windows journal lifecycle stress
        if: runner.os == 'Windows'
        timeout-minutes: 12
        run: cargo +1.98.0 nextest run --locked -p agentswapper-core --profile ci -E 'test(arbitrary_valid_lifecycles_replay_exactly)' --stress-count 10 --fail-fast
      - name: Report failing tests
        if: failure()
        run: python tools/report_test_failures.py target/nextest/ci/junit.xml
      - name: Windows Job custody probe
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: cargo +1.98.0 run --locked -p agentswapper-core --example windows_custody_probe
      - name: Linux delegated cgroup custody probe
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        timeout-minutes: 3
        shell: bash
        run: |
          cargo +1.98.0 build --locked -p agentswapper-core --example linux_custody_probe --example linux_terminal_guardian_probe
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo -n systemd-run --wait --pipe --collect --service-type=exec \
            --uid="$(id -u)" --gid="$(id -g)" --property=Delegate=yes \
            --property=RuntimeMaxSec=120 \
            --working-directory="$GITHUB_WORKSPACE" \
            --unit="aswp-custody-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            /usr/bin/python3 "$GITHUB_WORKSPACE/tools/run_delegated_custody_probe.py" \
            "$GITHUB_WORKSPACE/target/debug/examples/linux_custody_probe" \
            "$GITHUB_WORKSPACE/target/debug/examples/linux_terminal_guardian_probe"
      - name: Documentation examples
        run: cargo +1.98.0 test --locked --workspace --doc

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup toolchain install 1.98.0 --profile minimal
      - name: Restore pinned dependency checker
        id: deny-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/bin/cargo-deny*
          key: deny-${{ runner.os }}-${{ runner.arch }}-rust1.98.0-v0.20.2
      - if: steps.deny-cache.outputs.cache-hit != 'true'
        run: cargo +1.98.0 install cargo-deny --version 0.20.2 --locked
      - name: Save pinned dependency checker
        if: steps.deny-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/bin/cargo-deny*
          key: deny-${{ runner.os }}-${{ runner.arch }}-rust1.98.0-v0.20.2
      - run: cargo +1.98.0 deny --locked check
