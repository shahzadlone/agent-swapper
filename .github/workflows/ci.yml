name: Rust quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +1.98.0 fmt --all --check
      - name: Record platform evidence
        run: python tools/platform_evidence.py
      - name: Clippy
        run: cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
      - name: Windows per-run supervision probe
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: cargo +1.98.0 run --locked -p agentswapper-core --example windows_supervision_probe
      - name: Windows pre-assignment crash containment
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: |
          cargo +1.98.0 test --locked -p agentswapper-core --lib supervision::windows_job::tests::process_root_retires_child_if_supervisor_dies_before_per_run_assignment -- --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output '::notice title=Windows root Job::suspended child retired after supervisor death before per-run assignment'
      - name: Linux admission transport probe
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: cargo +1.98.0 run --locked -p agentswapper-core --example linux_admission_transport_probe
      - name: Linux guardian lease and process-group probe
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: cargo +1.98.0 run --locked -p agentswapper-core --example linux_guardian_probe
      - name: Linux guardian terminal job control
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: |
          cargo +1.98.0 build --locked -p agentswapper-core --example linux_terminal_guardian_probe
          python tools/check_linux_terminal_guardian.py target/debug/examples/linux_terminal_guardian_probe
      - name: Restore pinned test runner
        id: nextest-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/bin/cargo-nextest*
          key: nextest-${{ runner.os }}-${{ runner.arch }}-rust1.98.0-v0.9.150
      - name: Install test runner
        if: steps.nextest-cache.outputs.cache-hit != 'true'
        run: cargo +1.98.0 install cargo-nextest --version 0.9.150 --locked
      - name: Save pinned test runner
        if: steps.nextest-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/bin/cargo-nextest*
          key: nextest-${{ runner.os }}-${{ runner.arch }}-rust1.98.0-v0.9.150
      - name: Tests
        run: cargo +1.98.0 nextest run --locked --workspace --profile ci
      - name: Dashboard terminal entry and restoration
        if: runner.os != 'Windows'
        timeout-minutes: 2
        run: |
          cargo +1.98.0 build --locked -p agentswapper-cli --bins
          python tools/check_dashboard_pty.py target/debug/aswp target/debug/agentswapper
          python tools/check_dashboard_launch_pty.py target/debug/aswp
      - name: Hidden handover entry and signal restoration
        if: runner.os != 'Windows'
        timeout-minutes: 3
        run: python tools/check_handover_pty.py target/debug/aswp
      - name: Windows ACL qualification candidate
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: |
          cargo +1.98.0 test --locked -p agentswapper-windows-security ffi::tests:: -- --nocapture
      - name: Windows ACL separate identity
        if: runner.os == 'Windows' && runner.environment == 'github-hosted' && github.repository == 'shahzadlone/agent-swapper'
        timeout-minutes: 3
        env:
          ASWP_CI_IDENTITY_FIXTURE: '1'
        run: |
          cargo +1.98.0 nextest run --locked -p agentswapper-windows-security --profile ci --run-ignored only -E 'test(=ffi::identity_tests::separate_identity_cannot_access_private_objects)' --success-output immediate --no-output-indent
      - name: Windows native console restoration
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: |
          cargo +1.98.0 build --locked -p agentswapper-cli --bins
          cargo +1.98.0 run --locked -p agentswapper-core --example windows_terminal_probe -- target/debug/aswp.exe
      - name: Windows dashboard ConPTY transitions
        if: runner.os == 'Windows'
        timeout-minutes: 4
        run: |
          cargo +1.98.0 build --locked -p agentswapper-core --example windows_dashboard_probe
          python tools/check_windows_dashboard_conpty.py target/debug/aswp.exe target/debug/examples/windows_dashboard_probe.exe
      - name: Windows hidden handover entry and exact console restoration
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: python tools/check_windows_handover_conpty.py target/debug/aswp.exe target/debug/examples/windows_dashboard_probe.exe
      - name: Native launch terminal restoration
        if: runner.os != 'Windows'
        timeout-minutes: 2
        run: python tools/check_native_terminal_pty.py target/debug/aswp
      - name: Journal process-crash recovery matrix
        timeout-minutes: 12
        env:
          ASWP_JOURNAL_CRASH_TRIALS: '224'
        run: cargo +1.98.0 test --locked -p agentswapper-core --lib store::crash_tests::crash_lifecycle_reopens_consistently -- --ignored --exact
      - name: Preferences concurrency stress
        timeout-minutes: 3
        run: cargo +1.98.0 nextest run --locked -p agentswapper-core --profile ci -E 'test(config_concurrent_setters)' --stress-count 25 --fail-fast
      - name: Windows journal lifecycle stress
        if: runner.os == 'Windows'
        timeout-minutes: 12
        run: cargo +1.98.0 nextest run --locked -p agentswapper-core --profile ci -E 'test(arbitrary_valid_lifecycles_replay_exactly)' --stress-count 10 --fail-fast
      - name: Windows registry initialization concurrency stress
        if: runner.os == 'Windows'
        timeout-minutes: 6
        run: cargo +1.98.0 nextest run --locked -p agentswapper-core --profile ci -E 'test(concurrent_first_open_and_duplicate_registration_are_serialized)' --stress-count 100 --fail-fast
      - name: Windows optional SQLite sidecar retirement
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: cargo +1.98.0 test --locked -p agentswapper-core --lib private_fs::tests::optional_sidecar_ -- --nocapture
      - name: Report failing tests
        if: failure()
        run: python tools/report_test_failures.py target/nextest/ci/junit.xml
      - name: Windows Job custody probe
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: cargo +1.98.0 run --locked -p agentswapper-core --example windows_custody_probe
      - name: Linux delegated cgroup custody probe
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        timeout-minutes: 3
        shell: bash
        run: |
          python3 -m unittest discover -s tools -p test_delegated_custody_probe.py -v
          cargo +1.98.0 build --locked -p agentswapper-core --example linux_custody_probe --example linux_terminal_guardian_probe
          cargo +1.98.0 build --locked -p agentswapper-cli --bin aswp
          core_test="$(cargo +1.98.0 test --locked -p agentswapper-core --lib --no-run --message-format=json | python tools/find_core_test_binary.py)"
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo -n systemd-run --wait --pipe --collect --service-type=exec \
            --uid="$(id -u)" --gid="$(id -g)" --property=Delegate=yes \
            --property=RuntimeMaxSec=120 \
            --working-directory="$GITHUB_WORKSPACE" \
            --unit="aswp-custody-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            /usr/bin/python3 "$GITHUB_WORKSPACE/tools/run_delegated_custody_probe.py" \
            "$GITHUB_WORKSPACE/target/debug/examples/linux_custody_probe" \
            "$GITHUB_WORKSPACE/target/debug/examples/linux_terminal_guardian_probe" \
            "$core_test"
      - name: Documentation examples
        run: cargo +1.98.0 test --locked --workspace --doc

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.0 --profile minimal
      - name: Restore pinned dependency checker
        id: deny-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/bin/cargo-deny*
          key: deny-audited-${{ runner.os }}-${{ runner.arch }}-rust1.98.0-${{ hashFiles('tools/cargo-deny-tool.lock') }}
      - if: steps.deny-cache.outputs.cache-hit != 'true'
        run: |
          cargo +1.98.0 install cargo-deny --version 0.20.2 --locked
          python tools/build_audited_deny.py
      - name: Verify dependency checker build marker
        run: python tools/build_audited_deny.py --verify-only
      - name: Save pinned dependency checker
        if: steps.deny-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/bin/cargo-deny*
          key: deny-audited-${{ runner.os }}-${{ runner.arch }}-rust1.98.0-${{ hashFiles('tools/cargo-deny-tool.lock') }}
      - run: cargo +1.98.0 deny --locked check

  linux-manager-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build Rust manager identity probe
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          cargo +1.98.0 build --locked -p agentswapper-core --example linux_manager_identity_probe
      - name: Qualify root-owned service cleanup
        env:
          ASWP_MANAGED_VALIDATOR: ${{ github.workspace }}/target/debug/examples/linux_manager_identity_probe
        run: |
          python3 -m unittest discover -s tools -p test_linux_managed_scope.py -v
          python3 tools/check_linux_managed_scope.py

  linux-namespace-evidence:
    # A second distribution image gives the experimental namespace boundary a
    # chance to run without weakening the newer runner's security settings.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Record platform evidence
        run: python3 tools/platform_evidence.py
      - name: Exercise delegated custody and namespace probes
        timeout-minutes: 6
        shell: bash
        run: |
          python3 -m unittest discover -s tools -p test_delegated_custody_probe.py -v
          cargo +1.98.0 build --locked -p agentswapper-core --example linux_custody_probe --example linux_terminal_guardian_probe
          cargo +1.98.0 build --locked -p agentswapper-cli --bin aswp
          core_test="$(cargo +1.98.0 test --locked -p agentswapper-core --lib --no-run --message-format=json | python3 tools/find_core_test_binary.py)"
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo -n systemd-run --wait --pipe --collect --service-type=exec \
            --uid="$(id -u)" --gid="$(id -g)" --property=Delegate=yes \
            --property=RuntimeMaxSec=120 \
            --working-directory="$GITHUB_WORKSPACE" \
            --unit="aswp-custody-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            /usr/bin/python3 "$GITHUB_WORKSPACE/tools/run_delegated_custody_probe.py" \
            "$GITHUB_WORKSPACE/target/debug/examples/linux_custody_probe" \
            "$GITHUB_WORKSPACE/target/debug/examples/linux_terminal_guardian_probe" \
            "$core_test"

  candidate:
    needs: [test, dependencies]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.98.0 --profile minimal
      - name: Record candidate build environment
        run: python tools/platform_evidence.py
      - name: Verify archive and tool-audit boundaries
        run: python tools/run_candidate_tests.py
      - name: Restore pinned dependency checker
        id: candidate-deny-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/bin/cargo-deny*
          key: deny-audited-${{ runner.os }}-${{ runner.arch }}-rust1.98.0-${{ hashFiles('tools/cargo-deny-tool.lock') }}
      - name: Install dependency checker
        if: steps.candidate-deny-cache.outputs.cache-hit != 'true'
        run: |
          cargo +1.98.0 install cargo-deny --version 0.20.2 --locked
          python tools/build_audited_deny.py
      - name: Verify dependency checker build marker
        run: python tools/build_audited_deny.py --verify-only
      - name: Save dependency checker
        if: steps.candidate-deny-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/bin/cargo-deny*
          key: deny-audited-${{ runner.os }}-${{ runner.arch }}-rust1.98.0-${{ hashFiles('tools/cargo-deny-tool.lock') }}
      - name: Audit pinned attribution tool before installation
        run: python tools/audit_attribution_tool.py
      - name: Restore pinned attribution tool
        id: about-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/bin/cargo-about*
          key: about-audited-${{ runner.os }}-${{ runner.arch }}-rust1.98.0-v0.9.3
      - name: Install attribution tool
        if: steps.about-cache.outputs.cache-hit != 'true'
        run: python tools/build_audited_about.py
      - name: Verify attribution tool build marker
        run: python tools/build_audited_about.py --verify-only
      - name: Save pinned attribution tool
        if: steps.about-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/bin/cargo-about*
          key: about-audited-${{ runner.os }}-${{ runner.arch }}-rust1.98.0-v0.9.3
      - name: Build optimized binaries
        run: python tools/build_candidate_binaries.py
      - name: Generate and verify unsigned candidate
        run: python tools/release_candidate.py --output target/release-candidate
      - name: Store internal CI candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: unsigned-candidate-${{ runner.os }}-${{ runner.arch }}
          path: target/release-candidate/
          if-no-files-found: error
          retention-days: 7

  reproduce-candidate:
    needs: [candidate]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.98.0 --profile minimal
      - name: Record rebuild environment
        run: python tools/platform_evidence.py
      - name: Test rebuilt candidate comparison
        run: python -m unittest discover -s tools -p test_verify_rebuilt_candidate.py -v
      - name: Rebuild on a separate runner
        run: python tools/build_candidate_binaries.py
      - name: Download platform candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: unsigned-candidate-${{ runner.os }}-${{ runner.arch }}
          path: target/compare-candidate
      - name: Verify and compare rebuilt executables
        run: python tools/verify_rebuilt_candidate.py target/compare-candidate

  attest-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, dependencies, candidate, reproduce-candidate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - name: Test candidate-set verifier
        run: python -m unittest discover -s tools -p test_verify_candidate_set.py -v
      - name: Download this run's internal candidates
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: unsigned-candidate-*
          path: target/provenance-candidates
      - name: Verify candidate set and source binding
        run: python tools/verify_candidate_set.py target/provenance-candidates "$GITHUB_SHA"
      - name: Sign preview provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/provenance-candidates/*/*.zip
          create-storage-record: false
      - name: Verify signed provenance
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          for archive in target/provenance-candidates/*/*.zip; do
            gh attestation verify "$archive" --bundle "$BUNDLE_PATH" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
              --signer-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done
      - name: Store preview attestation bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: candidate-provenance-bundle
          path: ${{ steps.provenance.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 7
