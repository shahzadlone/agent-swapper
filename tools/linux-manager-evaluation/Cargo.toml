[package]
name = "aswp-linux-manager-evaluation"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
zbus = { version = "=6.2.0", default-features = false, features = ["tokio"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "time", "net"] }
rustix = { version = "=1.1.6", features = ["net", "process", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
