[package]
name = "aswp-linux-manager-evaluation"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
agentswapper-linux-runtime = { path = "../../crates/agentswapper-linux-runtime", version = "=0.1.0-dev" }
zbus = { version = "=6.2.0", default-features = false, features = ["tokio"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "time", "net"] }
rustix = { version = "=1.1.6", features = ["net", "process", "fs", "event", "time", "pty", "termios", "stdio"] }
nix = { version = "=0.31.3", default-features = false, features = ["socket", "signal", "ptrace"] }
unix-ancillary = { version = "=0.6.1", default-features = false }
fuxix = "=0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
nix = { version = "=0.31.3", default-features = false, features = ["ptrace", "signal"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
