[package]
name = "agentswapper-linux-install"
description = "Root installation executor for AgentSwapper Linux managed execution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
qualification = ["agentswapper-linux-runtime/qualification"]

[target.'cfg(target_os = "linux")'.dependencies]
agentswapper-linux-manager = { path = "../agentswapper-linux-manager", version = "=0.1.0-dev" }
agentswapper-linux-runtime = { path = "../agentswapper-linux-runtime", version = "=0.1.0-dev" }
rustix = { version = "=1.1.6", features = ["process", "net", "fs", "termios", "event", "pipe"] }
serde_json.workspace = true
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "time"] }
wait-timeout = "0.2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
