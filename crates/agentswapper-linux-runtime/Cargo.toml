[package]
name = "agentswapper-linux-runtime"
description = "Linux helper transport, terminal ownership and process observations for AgentSwapper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
qualification = []

[target.'cfg(target_os = "linux")'.dependencies]
agentswapper-linux-origin = { path = "../agentswapper-linux-origin", version = "=0.1.0-dev" }
rustix = { version = "=1.1.6", features = ["net", "fs", "event", "termios", "pty", "process"] }
zeroize.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.10.9"
nix = { version = "=0.31.3", default-features = false, features = ["signal", "term"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile.workspace = true
wait-timeout = "0.2"

[lints]
workspace = true
