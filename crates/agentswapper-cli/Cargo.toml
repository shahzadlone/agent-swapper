[package]
name = "agentswapper-cli"
description = "The aswp and agentswapper command line tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
default-run = "aswp"

[[bin]]
name = "aswp"
path = "src/bin/aswp.rs"

[[bin]]
name = "agentswapper"
path = "src/bin/agentswapper.rs"

[dependencies]
agentswapper-core = { path = "../agentswapper-core", version = "0.1.0-dev" }
clap = { version = "4.6", features = ["derive", "env"] }
serde.workspace = true
serde_json.workspace = true
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
crossterm = "0.29"
ctrlc = "3"
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
assert_cmd = "2"
predicates = "3"
insta = "1"

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", features = ["process"] }

[lints]
workspace = true
