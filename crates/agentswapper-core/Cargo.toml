[package]
name = "agentswapper-core"
description = "Profile registry and native launch safety for AgentSwapper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rusqlite = { version = "0.41", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
which = "8"
directories = "6"
dunce = "1"
age = { version = "=0.11.3", default-features = false }
sha2 = "0.10"
zeroize.workspace = true
tempfile.workspace = true
wait-timeout = "0.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process", "fs"] }

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
rusqlite = { version = "0.41", features = ["bundled", "hooks"] }
tempfile.workspace = true
proptest.workspace = true

[lints]
workspace = true
