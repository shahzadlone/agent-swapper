[package]
name = "agentswapper-windows-security"
description = "Experimental, handle-based Windows file security boundary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_System_IO", "Win32_System_WindowsProgramming", "Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices"] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
agentswapper-core = { path = "../agentswapper-core", version = "=0.1.0-dev" }
rusqlite = { version = "0.41", features = ["bundled"] }
getrandom = "=0.4.3"
zeroize.workspace = true
windows-sys = { version = "=0.61.2", features = ["Win32_NetworkManagement_NetManagement", "Win32_System_Ioctl", "Win32_Storage_Vhd"] }

# The only exception to the workspace's forbid rule is ffi.rs. The core,
# CLI, descriptor parser and policy remain entirely safe Rust.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
