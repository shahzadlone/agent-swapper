[package]
name = "agentswapper-linux-manager"
description = "Authenticated read-only Linux system-manager transport for AgentSwapper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
qualification = ["agentswapper-linux-runtime/qualification"]

[target.'cfg(target_os = "linux")'.dependencies]
agentswapper-linux-runtime = { path = "../agentswapper-linux-runtime", version = "=0.1.0-dev" }
zbus = { version = "=6.2.0", default-features = false, features = ["tokio"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "time", "net"] }
rustix = { version = "=1.1.6", features = ["process"] }
nix = { version = "=0.31.3", default-features = false, features = ["socket"] }
serde.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "time", "test-util"] }

[lints]
workspace = true
