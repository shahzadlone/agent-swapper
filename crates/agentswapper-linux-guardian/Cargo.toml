[package]
name = "agentswapper-linux-guardian"
description = "Root-installed guardian entry for AgentSwapper Linux managed execution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
agentswapper-linux-runtime = { path = "../agentswapper-linux-runtime", version = "=0.1.0-dev" }
rustix = { version = "=1.1.6", features = ["process", "time", "termios"] }
nix = { version = "=0.31.3", default-features = false, features = ["ptrace", "signal"] }
serde_json.workspace = true

[lints]
workspace = true
