[package]
name = "agentswapper-linux-session-helper"
description = "Outer-owner session helper: the launch client wired to the durable Store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "aswp-session-helper"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
agentswapper-core = { path = "../agentswapper-core", version = "=0.1.0-dev", features = ["linux-journal-qualification"] }
agentswapper-linux-install = { path = "../agentswapper-linux-install", version = "=0.1.0-dev" }
agentswapper-linux-manager = { path = "../agentswapper-linux-manager", version = "=0.1.0-dev" }
agentswapper-linux-runtime = { path = "../agentswapper-linux-runtime", version = "=0.1.0-dev" }
rustix = { version = "=1.1.6", features = ["process"] }
serde_json.workspace = true
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

[lints]
workspace = true
